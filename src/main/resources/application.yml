
spring:
  datasource:
    url: jdbc:h2:file:./data/homek
    driver-class-name: org.h2.Driver
    username: sa
    password:



  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false


kroger:
  client-id: ${KROGER_CLIENT_ID:}
  client-secret: ${KROGER_CLIENT_SECRET:}

app:
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}


logging:
  level:
    root: WARN
    # HoMeK application
    com.homewerk.backend: INFO
    # Spring framework
    org.springframework: WARN
    org.springframework.security: WARN
    # Database / ORM
    org.hibernate: WARN
    org.springframework.data: WARN
    com.zaxxer.hikari: WARN
    # Web server
    org.apache.tomcat: WARN


